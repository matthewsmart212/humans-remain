<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Boar & Wolf · Humans Remain</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102d30;color:#f3e4c3;font:16px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px max(20px,env(safe-area-inset-left))}h1{font:800 clamp(26px,4vw,42px) Georgia,serif;margin:0 0 8px}p{color:#d2c5a5;margin:0 0 20px;line-height:1.5}.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-bottom:16px}label{display:grid;gap:6px;font-size:12px;letter-spacing:.05em}select,button,a{min-height:44px;border:1px solid #a99c77;border-radius:8px;background:#214346;color:#fff0cf;padding:10px 14px;font:inherit}button,a{cursor:pointer}a{display:inline-flex;align-items:center;text-decoration:none;margin-left:auto;background:#e0cc9d;color:#173c3d}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #ffcf79;outline-offset:3px}canvas{width:100%;height:auto;display:block;background:#c7a16e;border:2px solid #a89b76;border-radius:14px}.note{margin-top:16px;font-size:13px}.loading{min-height:24px;color:#ffcf79}@media(max-width:600px){main{padding:16px}a{margin-left:0}}
</style></head><body><main><h1>Boar & Wolf</h1><p>Movement, warnings, attacks and recovery. Preview the finished sprites in every direction.</p>
<div class="toolbar"><label>ANIMATION<select id="animation"><option value="attack">Attack sequence</option><option value="warning">Warning</option><option value="walk">Walk</option><option value="run">Run</option><option value="idle">Idle & blink</option><option value="hit">Hit reaction</option><option value="death">Fall & downed</option></select></label><label>DIRECTION<select id="direction"><option value="down-left">Southwest</option><option value="down">South</option><option value="left">West</option><option value="up-left">Northwest</option><option value="up">North</option><option value="up-right">Northeast</option><option value="right">East</option><option value="down-right">Southeast</option></select></label><button id="toggle" type="button">Pause</button><button id="replay" type="button">Replay</button><a href="/survival/predators-v1/sprite-pack.zip" download>Download both sprite sets</a></div>
<div id="status" class="loading" role="status">Loading sprites…</div><canvas id="stage" width="1100" height="420" aria-label="Animated wild boar and grey wolf sprite preview"></canvas><p class="note">Both animals are now in Play mode outside camp: two wild boars and two grey wolves, with warned attacks, combat feedback and wild-meat rewards.</p></main>
<script type="module">
const manifest=await fetch('/survival/predators-v1/artwork.json').then(r=>{if(!r.ok)throw Error('Unable to load sprite definitions');return r.json()}),canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d'),animation=document.querySelector('#animation'),direction=document.querySelector('#direction'),status=document.querySelector('#status'),images=new Map();let started=performance.now(),paused=false,pausedAt=0;
function image(kind,view){const key=kind+'/'+view;if(!images.has(key)){const im=new Image();images.set(key,im);im.onload=()=>{status.textContent=''};im.onerror=()=>{status.textContent='A sprite could not load. Refresh to retry.'};im.src='/survival/predators-v1/'+key+'.webp'}return images.get(key)}
function frame(clip,seconds){let ms=Math.max(0,seconds*1000),duration=clip.milliseconds.reduce((a,b)=>a+b,0);ms%=duration+(clip.loop?0:650);for(let i=0;i<clip.frames.length;i++){if(ms<clip.milliseconds[i])return clip.frames[i];ms-=clip.milliseconds[i]}return clip.frames.at(-1)}
const boarScale=await fetch('/survival/predators-v1/boar-scale.json').then(r=>{if(!r.ok)throw Error('Unable to load view sizing');return r.json()});
function draw(now){const age=((paused?pausedAt:now)-started)/1000,view=manifest.views[direction.value];ctx.clearRect(0,0,1100,420);ctx.fillStyle='#c7a16e';ctx.fillRect(0,0,1100,420);ctx.strokeStyle='#77582b44';ctx.beginPath();ctx.moveTo(40,318);ctx.lineTo(1060,318);ctx.stroke();
 for(const [kind,x] of [['boar',280],['wolf',820]]){const clip=manifest.combatClips[kind][animation.value]??manifest.clips[animation.value],index=frame(clip,age),im=image(kind,view.source),scale=1.2*(kind==='boar'?boarScale[view.source]:1);ctx.save();ctx.translate(x,320);ctx.scale(view.mirror?-scale:scale,scale);if(im.complete&&im.naturalWidth)ctx.drawImage(im,index%4*224,Math.floor(index/4)*224,224,224,-112,-204,224,224);ctx.restore();ctx.textAlign='center';ctx.fillStyle='#193b37';ctx.font='bold 24px Georgia';ctx.fillText(kind==='boar'?'WILD BOAR':'GREY WOLF',x,43);const phase=index===10?'Warning':index===11||index===12?'Wind-up':index===13?'Launch':index===14?'Contact':index===15?'Follow-through':index===16||index===17?'Recovery':manifest.frames[index].replaceAll('-',' ');ctx.font='bold 15px system-ui';ctx.fillText(phase,x,370)}requestAnimationFrame(draw)}
function reset(){started=performance.now();pausedAt=started}
animation.onchange=direction.onchange=reset;document.querySelector('#replay').onclick=reset;document.querySelector('#toggle').onclick=e=>{if(paused){started+=performance.now()-pausedAt;paused=false;e.target.textContent='Pause'}else{pausedAt=performance.now();paused=true;e.target.textContent='Play'}};requestAnimationFrame(draw);
</script></body></html>
