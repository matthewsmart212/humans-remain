const images={},canvas=document.getElementById('camp'),ctx=canvas.getContext('2d');
const settings={motion:!matchMedia('(prefers-reduced-motion: reduce)').matches,wind:1,survivor:true};
let renderer,clock=0,last=0,visible=!document.hidden,dirty=true;
function syncPause(){document.getElementById('pause').textContent=settings.motion?'Pause motion':'Play motion';document.getElementById('pause').setAttribute('aria-pressed',String(!settings.motion));}
document.getElementById('pause').onclick=()=>{settings.motion=!settings.motion;last=0;dirty=true;syncPause();};syncPause();
document.getElementById('wind').onchange=e=>{settings.wind=Number(e.target.value);dirty=true;};
document.getElementById('survivor').onchange=e=>{settings.survivor=e.target.checked;dirty=true;};
document.querySelectorAll('[data-layer]').forEach(e=>e.onchange=()=>{settings[e.dataset.layer]=e.checked;dirty=true;});
document.addEventListener('visibilitychange',()=>{visible=!document.hidden;last=0;dirty=true;});
Promise.all(Object.entries(sources).map(([k,src])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[k]=im;resolve();};im.onerror=()=>reject(new Error('Unable to load '+k));im.src=src;}))).then(()=>{renderer=createCampRenderer(ctx,manifest,images);window.campPreview={renderer,manifest,settings};requestAnimationFrame(tick);}).catch(e=>{canvas.insertAdjacentHTML('afterend','<p>'+e.message+'</p>');});
