name: Import approved start-screen soundtrack
on:
  push:
    branches: [main]
    paths:
      - scripts/import-start-menu-music.py
      - public/audio/README.md
      - public/audio/start-menu.mp3
      - .github/workflows/import-start-menu-music.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-soundtrack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and verify approved Sonican soundtrack
        run: python3 scripts/import-start-menu-music.py
      - name: Bundle soundtrack in Expo rather than streaming from GitHub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('native/StartingScreen.tsx')
          content = path.read_text()
          old = "{uri:'https://raw.githubusercontent.com/matthewsmart212/humans-remain/main/public/audio/start-menu.mp3'}"
          new = "require('../public/audio/start-menu.mp3')"
          if old in content:
              path.write_text(content.replace(old, new).replace(
                  " // Use a URI rather than a require() until the binary import commit has landed.\n",
                  " // Bundle with Expo so the starting screen plays offline as well.\n"
              ))
          elif new not in content:
              raise SystemExit('Could not find the native menu audio source')
          PY
      - name: Commit bundled start-screen audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/start-menu.mp3 native/StartingScreen.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Bundle the approved Sonican start-screen soundtrack"
            git push origin HEAD:main
          fi
