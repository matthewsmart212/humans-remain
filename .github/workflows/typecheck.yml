name: Typecheck web and iOS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify camp milestones and HQ recipe availability
        run: |
          node scripts/check-camp-levels.mjs
          node scripts/check-camp-recipes.mjs
      - name: Check campfire menu and ground food collection
        run: |
          node scripts/check-campfire-menu.mjs
          node scripts/check-campfire-experience.mjs
          node scripts/check-cooked-food-drops.mjs
      - name: Test four-second cinematic title transition
        run: node scripts/check-intro-title-transition.mjs
      - name: Test browser opening intro parity
        run: node scripts/check-browser-intro-transition.mjs
      - name: Test persistent owner unlock for publishing
        run: node scripts/check-owner-publishing-unlock.mjs
      - name: Verify signed Cloudflare Access owner identity
        run: node scripts/check-cloudflare-owner.mjs
      - name: Test independent upgrade-tier positions
        run: node scripts/check-tier-positions.mjs
      - name: Check potato patch starts broken and switches only when repaired
        run: node scripts/check-potato-patch-start-broken.mjs
      - name: Check mixed vegetable beds, growth, harvesting and food
        run: node scripts/check-vegetable-farming.mjs
      - name: Test editor selection inside roofless buildings
        run: node scripts/check-interior-selection.mjs
      - name: Test server-side bundled world publication
        run: node scripts/check-world-bundle-publishing.mjs
      - name: Check smallholding fences and saved-world repairs
        run: |
          node scripts/check-smallholding.mjs
          node scripts/check-smallholding-render.mjs
      - name: Check evacuation van placement and saved salvage
        run: |
          node scripts/check-evacuation-van.mjs
          node scripts/check-evacuation-loot.mjs
      - name: Check Stillwater lake art, jetty walking and visible fish
        run: |
          node scripts/check-fishing-site.mjs
          node scripts/check-fishing-site-behavior.mjs
          node scripts/check-fishing-water-life.mjs
          node scripts/check-stillwater-lake.mjs
      - name: Test fishing gameplay, input, inventory and saved catches
        run: |
          node scripts/check-fishing-gameplay.mjs
          node scripts/check-fishing-controls.mjs
          node scripts/check-fishing-inventory.mjs
          node scripts/check-fishing-save.mjs
          node scripts/check-fishing-feedback.mjs
      - name: Test Patch rescue, following and owner world preservation
        run: |
          node scripts/check-patch-quest.mjs
          node scripts/check-patch-dialogue.mjs
          node scripts/check-patch-site.mjs
          node scripts/check-patch-animation.mjs --browser-only
          node scripts/check-patch-ui.mjs
      - name: Test co-op room protocol and hibernation
        run: node scripts/check-coop-room.mjs
      - name: Test all Hunter walking frames and carried tools
        run: node scripts/check-hunter-walk-frames.mjs
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: native/package-lock.json
      # Shared source lives outside native/, so its React dependencies
      # must also exist in the repository root for TypeScript resolution.
      - run: npm ci
      - run: npm ci
        working-directory: native
      - run: npm run typecheck
        working-directory: native
      - name: Render rare chest effects with web and native Skia
        run: node scripts/check-loot-chest-fx.mjs
      - name: Verify Patch walking frames on web and native Skia
        run: node scripts/check-patch-animation.mjs
