name: Typecheck web and iOS
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
        working-directory: native
      - run: npm run typecheck
        working-directory: native
