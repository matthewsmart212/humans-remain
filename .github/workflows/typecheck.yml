name: Typecheck web and iOS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test four-second cinematic title transition
        run: node scripts/check-intro-title-transition.mjs
      - name: Test browser opening intro parity
        run: node scripts/check-browser-intro-transition.mjs
      - name: Test persistent owner unlock for publishing
        run: node scripts/check-owner-publishing-unlock.mjs
      - name: Test independent upgrade-tier positions
        run: node scripts/check-tier-positions.mjs
      - name: Test editor selection inside roofless buildings
        run: node scripts/check-interior-selection.mjs
      - name: Test server-side bundled world publication
        run: node scripts/check-world-bundle-publishing.mjs
      - name: Test co-op room protocol and hibernation
        run: node scripts/check-coop-room.mjs
      - name: Test all Hunter walking frames and carried tools
        run: node scripts/check-hunter-walk-frames.mjs
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: native/package-lock.json
      # Shared source lives outside native/, so its React dependencies
      # must also exist in the repository root for TypeScript resolution.
      - run: npm ci
      - run: npm ci
        working-directory: native
      - run: npm run typecheck
        working-directory: native
