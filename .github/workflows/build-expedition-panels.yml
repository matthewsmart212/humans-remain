name: Bundle approved expedition plaques
on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract-expedition-panels.py'
      - '.github/workflows/build-expedition-panels.yml'
      - 'public/survival/expedition-menu-v2/approved-cards.webp'
permissions:
  contents: write
concurrency:
  group: expedition-panel-extraction
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract original painted signs into transparent PNGs
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/extract-expedition-panels.py
      - name: Commit the actual RGBA textures for browser and Expo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/survival/expedition-menu-v2/panels/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Bundle transparent original expedition plaques for iOS and web"
            git push origin HEAD:main
          else
            echo "Approved illustrated plaques are already current."
          fi
