name: Deploy Humans Remain Web

# First-run manual testing. Enable push-to-main after Cloudflare credentials,
# D1/R2 bindings, and the initial site validation are complete.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: humans-remain-web-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source without automatic LFS download
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          lfs: false
          fetch-depth: 1

      - name: Restore artwork without missing legacy camp-gate
        shell: bash
        run: |
          legacy='public/survival/expedition-menu-v1/camp-gate.webp'
          if git grep -n -F 'expedition-menu-v1/camp-gate.webp' HEAD -- src server native scripts; then
            echo "::error::Legacy camp-gate is still referenced by runtime source; cannot omit safely."
            exit 1
          fi
          echo "Skipping only unused legacy LFS path: $legacy"
          git lfs pull --exclude="$legacy"
          # Keep the original LFS pointer committed for future restoration, but
          # do not accidentally publish its 130-byte pointer as a WebP image.
          rm -f "$legacy"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials are configured
        env:
          CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CF_ACCOUNT_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_TOKEN_PRESENT" != "true" ] || [ "$CF_ACCOUNT_PRESENT" != "true" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets."
            exit 1
          fi

      - name: Build web client and Worker
        run: npm run build

      - name: Apply D1 schema migrations to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply humans-remain-db --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
