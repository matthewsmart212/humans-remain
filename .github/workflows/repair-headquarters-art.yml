name: Commit cleaned HQ textures
on:
  push:
    branches: [main]
    paths:
      - 'scripts/clean-headquarters-edges.py'
      - 'scripts/soften-headquarters-terrain.py'
      - 'public/survival/headquarters-v4/**'
      - '.github/workflows/repair-headquarters-art.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          lfs: false
          fetch-depth: 1
      - name: Fetch only current HQ image assets from LFS
        run: git lfs pull --include="public/survival/headquarters-v4/*.webp" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install Pillow==11.3.0
      - name: Remove white fringes from all four HQ textures
        run: python scripts/clean-headquarters-edges.py
      - name: Edit ONLY terrain around authentic repaired and broken HQ bases
        shell: bash
        run: |
          before=$(sha256sum public/survival/headquarters-v4/{repaired,broken}-exterior.webp)
          python scripts/soften-headquarters-terrain.py
          after=$(sha256sum public/survival/headquarters-v4/{repaired,broken}-exterior.webp)
          test "$before" = "$after" || { echo "::error::A roof image changed"; exit 1; }
      - name: Commit repaired terrain-only base sprites to main for iOS and web
        shell: bash
        run: |
          git add public/survival/headquarters-v4/repaired-interior.webp public/survival/headquarters-v4/broken-interior.webp public/survival/headquarters-v4/.alpha-cleanup.json public/survival/headquarters-v4/.terrain-blend.json
          if git diff --cached --quiet; then
            echo 'Original HQ bases already have terrain-only feathering'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Feather only surrounding terrain on original HQ bases'
          git push origin HEAD:main
