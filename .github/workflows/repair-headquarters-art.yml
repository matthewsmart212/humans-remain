name: Commit cleaned HQ textures
on:
  push:
    branches: [main]
    paths:
      - 'scripts/clean-headquarters-edges.py'
      - 'public/survival/headquarters-v4/**'
      - '.github/workflows/repair-headquarters-art.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install Pillow==11.3.0
      - name: Remove white fringes from all four HQ textures
        run: python scripts/clean-headquarters-edges.py
      - name: Commit clean game-ready assets to main for iOS and web
        shell: bash
        run: |
          git add public/survival/headquarters-v4/*.webp public/survival/headquarters-v4/.alpha-cleanup.json
          if git diff --cached --quiet; then
            echo 'HQ textures already clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove pale alpha fringes from all four HQ textures'
          git push origin HEAD:main
