name: Verify Humans Remain Cloudflare World

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Cloudflare configuration
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          lfs: false
          fetch-depth: 1

      - name: Inspect live D1 world without modifying anything
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute humans-remain-db --remote --command "SELECT id,revision,length(applied_json) AS applied_bytes,length(draft_json) AS draft_bytes,json_array_length(applied_json,'$.items') AS placed_objects FROM world_layout WHERE id='main';"
          npx --yes wrangler@4 d1 execute humans-remain-db --remote --command "SELECT (SELECT count(*) FROM asset_artwork) AS artwork_records,(SELECT count(*) FROM asset_art_files) AS artwork_files,(SELECT count(*) FROM custom_assets) AS custom_assets;"
