<!doctype html><html><head><meta charset="utf-8"><title>Camp placement and resource visibility</title><style>body{margin:12px;background:#14231c;color:#e9dfc1;font:14px Arial}nav{display:flex;gap:16px;align-items:center;margin-bottom:10px}select{padding:5px;background:#26453b;color:#f7e8c6;border:1px solid #9d906c}iframe{display:block;width:844px;height:390px;border:1px solid #83966c}</style></head><body><nav><label>Scene <select id="scenario"><option value="hidden">Loot under foliage</option><option value="berries">Ripe berries</option><option value="empty">Empty bush</option><option value="night">Night visibility</option><option value="smithy">Smithy crafting</option><option value="smithy-poor">Smithy without materials</option><option value="smithy-full">Smithy full backpack</option><option value="camp">Furnace by workshop</option></select></label><label>Viewport <select id="viewport"><option value="844,390">iPhone landscape</option><option value="390,700">iPhone portrait</option></select></label><span>Local exercise · actual authored world, renderer and HUD</span></nav><iframe title="Resource visibility gameplay" src="/scripts/resource-outlines-preview.html?scene=hidden"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#scenario').onchange=e=>frame.src='/scripts/resource-outlines-preview.html?scene='+e.target.value;document.querySelector('#viewport').onchange=e=>{const [w,h]=e.target.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px'};</script></body></html>
