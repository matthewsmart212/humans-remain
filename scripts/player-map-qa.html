<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player map responsive QA</title><style>body{margin:0;background:#071c20;color:#eddfbf;font:14px Arial}header{display:flex;gap:15px;align-items:center;padding:12px;flex-wrap:wrap}select,button{font:inherit;padding:8px}iframe{display:block;border:1px solid #73938b;margin:0 12px}</style></head><body><header><label>Viewport <select id="size"><option value="390,844">iPhone portrait · 390 × 844</option><option value="844,390">iPhone landscape · 844 × 390</option><option value="320,568">Small phone · 320 × 568</option><option value="1024,768">Tablet · 1024 × 768</option></select></label><button data-zoom=".1">World overview</button><button data-zoom=".24">Camp view</button><button data-zoom=".48">Close detail</button><button data-zoom="1">Gameplay</button><span>Development QA · bundled world · no cloud writes</span></header><iframe title="Map preview" src="/scripts/player-map-preview.html" width="390" height="844"></iframe><script>document.querySelector('select').onchange=e=>{const [w,h]=e.target.value.split(',');const f=document.querySelector('iframe');f.width=w;f.height=h};for(const b of document.querySelectorAll('button'))b.onclick=()=>document.querySelector('iframe').contentWindow.postMessage({type:'atlas-qa-view',zoom:Number(b.dataset.zoom)},location.origin);</script></body></html>
