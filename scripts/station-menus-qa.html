<!doctype html><html><head><meta charset="utf-8"><title>Camp menu camera and layout</title><style>body{margin:12px;background:#14231c;color:#e9dfc1;font:14px Arial}nav{display:flex;gap:16px;align-items:center;margin-bottom:10px}select{padding:5px;background:#26453b;color:#f7e8c6;border:1px solid #9d906c}iframe{display:block;width:844px;height:390px;border:1px solid #83966c}</style></head><body><nav><label>Menu <select id="scenario"><option value="fire">Campfire</option><option value="fire-empty">Campfire (empty)</option><option value="smithy">Smithy</option><option value="furnace">Furnace</option><option value="storage">Storage</option><option value="warehouse">Warehouse</option><option value="backpack">Backpack</option></select></label><label>Viewport <select id="viewport"><option value="844,390">iPhone landscape</option><option value="390,700">iPhone portrait</option><option value="667,320">Small landscape</option><option value="320,568">Small portrait</option></select></label><span>Actual gameplay · menu framing</span></nav><iframe title="Camp menu gameplay" src="/scripts/resource-outlines-preview.html?scene=fire"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#scenario').onchange=e=>frame.src='/scripts/resource-outlines-preview.html?scene='+e.target.value;document.querySelector('#viewport').onchange=e=>{const [w,h]=e.target.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px'};</script></body></html>
