<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick selector responsive QA</title><style>body{margin:0;background:#071c20;color:#eddfbf;font:14px Arial}header{padding:10px;display:flex;gap:12px;align-items:center}select{padding:8px;font:inherit}iframe{display:block;border:1px solid #73938b;margin:0 10px}</style></head><body><header><label>Viewport <select id="size"><option value="844,390">Landscape · 844 × 390</option><option value="390,844">Portrait · 390 × 844</option><option value="320,568">Small phone · 320 × 568</option></select></label><label>Items <select id="items"><option value="four">Four owned items</option><option value="all">All six owned items</option><option value="empty">Fists only</option></select></label></header><iframe title="Quick selector preview" src="/scripts/player-map-preview.html?quickbar=four" width="844" height="390"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#size').onchange=e=>{const[w,h]=e.target.value.split(',');frame.width=w;frame.height=h};document.querySelector('#items').onchange=e=>frame.src='/scripts/player-map-preview.html'+(e.target.value==='empty'?'':'?quickbar='+e.target.value);</script></body></html>
