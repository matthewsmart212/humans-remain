<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Headquarters · layout verification</title><style>body{margin:12px;background:#0b221f;color:#ecd7aa;font:14px Arial}nav{display:flex;gap:16px;margin-bottom:12px;align-items:center}select{padding:8px;background:#1e4035;color:#f6e3b9;border:1px solid #a58c5e}iframe{display:block;border:1px solid #987f4f;width:1180px;height:650px}</style></head><body><nav><label>Viewport <select id="size"><option value="1180,650">Desktop</option><option value="844,390">iPhone landscape</option><option value="667,320">Small landscape</option><option value="390,700">Portrait</option></select></label><label>Run <select id="run"><option value="fresh">Fresh camp</option><option value="found">Bellows found</option><option value="metal">Metalworking restored</option><option value="damaged">Damaged camp</option></select></label><span>Production headquarters component · isolated test run</span></nav><iframe title="Headquarters test run" src="/scripts/headquarters-qa.html"></iframe><script>const f=document.querySelector('iframe');document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split(',');f.style.width=w+'px';f.style.height=h+'px'};document.querySelector('#run').onchange=e=>f.src='/scripts/headquarters-qa.html?run='+e.target.value;</script></body></html>
